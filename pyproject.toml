[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-rag"
version = "0.1.0"
description = "Hybrid-retrieval (ChromaDB + BM25 + RRF), citation-grounded RAG over health-insurance policies, served with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "google-genai>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-anthropic>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
